<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Dashboard - AttendEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #7b2ff7, #a4508b);
      color: white;
      margin: 0;
      min-height: 100vh;
    }

    .navbar {
      background-color: rgba(0, 0, 0, 0.6);
    }

    .dashboard-container {
      margin-top: 70px;
      text-align: center;
    }

    .card {
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      border-radius: 12px;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      background-color: rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">AttendEase - Faculty</a>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container dashboard-container">
    <h2 class="mb-4">Welcome, Faculty 👩‍🏫</h2>

    <div class="row justify-content-center">
      <div class="col-md-3">
        <div class="card p-3">
          <h5>Mark Attendance</h5>
          <p>Take attendance for your class</p>
          <button class="btn btn-light btn-sm">Open</button>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card p-3">
          <h5>View Reports</h5>
          <p>Check attendance summaries</p>
          <button class="btn btn-light btn-sm">Open</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function logout() {
      alert("Logged out successfully!");
      window.location.href = "../login.html";
    }
  </script>

</body>
</html>
